<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة — مستودع الشحن الجوي</title>
<style>
@font-face{font-family:'Cairo';font-style:normal;font-weight:500 900;font-display:swap;src:url(vendor/fonts/cairo-arabic.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:'Cairo';font-style:normal;font-weight:500 900;font-display:swap;src:url(vendor/fonts/cairo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122}
:root{--paper:#e9edef;--ink:#12212e;--red:#d4281e;--blue:#1c4e8a;--field:#d3dade;--mute:#4b5c69;--ok:#1f8a52;--gold:#c58a00;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#0a121c;color:var(--ink);font-family:'Cairo',system-ui,"Segoe UI",Tahoma,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 32px}
.sheet{max-width:980px;margin:0 auto;border:8px solid transparent;border-radius:4px;background:linear-gradient(var(--paper),var(--paper)) padding-box,repeating-linear-gradient(-45deg,var(--red) 0 7px,var(--paper) 7px 14px) border-box;box-shadow:0 22px 60px rgba(0,0,0,.55);padding:22px clamp(14px,3vw,30px) 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
h1{margin:0;font-size:clamp(22px,4vw,30px);font-weight:900}
.sub{margin:2px 0 0;color:var(--mute);font-weight:600;font-size:13px}
.btn{font:800 14px inherit;font-family:inherit;border:0;border-radius:3px;padding:9px 16px;background:var(--ink);color:#fff;cursor:pointer}
.btn.red{background:var(--red);box-shadow:0 4px 0 #8f1a12}
.btn.red:active{transform:translateY(3px);box-shadow:0 1px 0 #8f1a12}
.lang{background:#fff;color:var(--ink);border:2px solid var(--ink);padding:7px 14px}
.btn.ghost{background:none;color:var(--blue);text-decoration:underline;padding:6px}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#gate{max-width:340px;margin:12vh auto;text-align:center}
#gate input{width:100%;height:46px;border:2px solid var(--ink);border-radius:3px;background:#fff;font:800 20px ui-monospace,Consolas,monospace;text-align:center;letter-spacing:3px;margin:10px 0}
#gate .err{color:var(--red);font-weight:800;min-height:20px;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--field);border-radius:4px;padding:12px 14px;border-inline-start:6px solid var(--ink)}
.stat b{display:block;font-size:30px;font-weight:900;line-height:1.1;font-family:ui-monospace,Consolas,monospace}
.stat span{font-size:13px;font-weight:700;color:var(--mute)}
.stat.hot{border-color:var(--red)}.stat.ok{border-color:var(--ok)}.stat.gold{border-color:var(--gold)}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
nav button{font:800 14px inherit;font-family:inherit;padding:8px 16px;border:2px solid var(--ink);border-radius:3px;background:#fff;color:var(--ink);cursor:pointer}
nav button[aria-selected=true]{background:var(--ink);color:#fff}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools input{flex:1;min-width:160px;height:38px;border:2px solid var(--ink);border-radius:3px;padding:0 10px;font:700 14px inherit;font-family:inherit;background:#fff}
.tw{overflow-x:auto;border:2px solid var(--ink);border-radius:3px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px;font-weight:700;min-width:520px}
th{background:var(--ink);color:#fff;text-align:center;padding:9px 12px;font-weight:800;white-space:nowrap;position:sticky;top:0}
td{padding:8px 12px;border-top:1px solid #c7ced3;white-space:nowrap;text-align:center}
tr:nth-child(even) td{background:#f4f6f7}
td.n{font-family:ui-monospace,Consolas,monospace;direction:ltr}
td.rk{font-weight:900;color:var(--red);width:48px}
tr.top1 td{background:#fff3cd!important}
.mute{color:var(--mute);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--mute);font-weight:700}
.wipe{background:#fff;border:3px solid var(--red);border-radius:3px;padding:14px 16px;margin-bottom:14px}
.wipe h2{margin:0 0 4px;font-size:18px;font-weight:900;color:var(--red)}
.wipe p{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--mute)}
.wipe .modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.wipe .modes button{font:800 13px inherit;font-family:inherit;padding:7px 14px;border:2px solid var(--ink);border-radius:3px;background:#fff;color:var(--ink);cursor:pointer}
.wipe .modes button[aria-pressed=true]{background:var(--ink);color:#fff}
.wipe .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.wipe input{height:38px;border:2px solid var(--ink);border-radius:3px;padding:0 10px;font:700 14px inherit;font-family:inherit;background:#fff;min-width:0;flex:1 1 180px}
.wipe .msg{min-height:20px;font-weight:800;font-size:14px;margin:6px 0 0}
.wipe .msg.err{color:var(--red)}.wipe .msg.ok{color:var(--ok)}
.warn{background:#fff3cd;border:2px solid var(--gold);border-radius:3px;padding:10px 14px;font-weight:700;margin-bottom:12px}
/* الهواتف: الصفوف تتحول إلى بطاقات (اسم العمود يسار/يمين القيمة) بدل جدول عريض */
@media (max-width:640px){
  body{padding:max(10px,env(safe-area-inset-top)) 10px 24px}
  .sheet{padding:14px 12px 20px;border-width:6px}
  header{gap:8px;padding-bottom:10px;margin-bottom:12px}
  header>div:last-child{display:flex;gap:6px;flex-wrap:wrap}
  .btn{padding:9px 12px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat{padding:10px 12px}.stat b{font-size:24px}.stat span{font-size:12px}
  nav{flex-wrap:nowrap;overflow-x:auto;margin-inline:-12px;padding:0 12px 4px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap;flex:0 0 auto;padding:9px 14px}
  .tools input{flex:1 1 100%;height:44px;font-size:16px}
  .wipe{padding:12px}.wipe input{font-size:16px;height:44px;flex:1 1 100%}.wipe .row .btn{flex:1 1 40%;padding:12px}
  #gate{margin:8vh auto}#gate input{font-size:18px}
  .tw{border:0;background:none;overflow:visible}
  table{min-width:0;display:block;font-size:14px}
  thead{display:none}
  tbody{display:grid;gap:10px}
  tr{display:block;background:#fff;border:2px solid var(--ink);border-radius:3px;padding:4px 12px}
  tr:nth-child(even) td{background:none}
  tr.top1{border-color:var(--gold);box-shadow:0 0 0 2px #ffe08a}
  td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-top:1px dashed #c7ced3;white-space:normal;text-align:end}
  td:first-child{border-top:0}
  td::before{content:attr(data-l);font-weight:800;color:var(--mute);font-size:12.5px;flex:0 0 auto;text-align:start}
  td.rk{width:auto;font-size:18px}
  td.n{direction:ltr}
  td.empty{display:block;text-align:center;border:0}td.empty::before{display:none}
}
</style>
</head>
<body>
<main class="sheet">
<section id="gate">
<h1 data-k="title">لوحة الإدارة</h1>
<p class="sub" data-k="gate">أدخل الرمز السري للإدارة</p>
<form id="gf"><input id="code" type="password" inputmode="numeric" autocomplete="off" dir="ltr" aria-label="الرمز السري"><p class="err" id="gerr" role="alert"></p><button class="btn red" type="submit" data-k="enter">دخول</button></form>
</section>
<section id="app" hidden>
<header>
<div><h1 data-k="title">لوحة الإدارة</h1><p class="sub" id="upd"></p></div>
<div><button class="btn lang" id="lang" type="button" aria-label="Language">EN</button> <button class="btn" id="wipeBtn" type="button" data-k="wipeBtn">مسح الأرقام</button> <button class="btn" id="refresh" type="button" data-k="refresh">تحديث</button> <button class="btn ghost" id="lock" type="button" data-k="lock">قفل</button></div>
</header>
<section id="wipe" class="wipe" hidden>
<h2 data-k="wipeT">مسح الأرقام القياسية</h2>
<p data-k="wipeP">عملية نهائية لا يمكن التراجع عنها. تتطلب إدخال الرمز السري من جديد.</p>
<div class="modes" id="wmodes"><button type="button" data-m="all" aria-pressed="true" data-k="wAll">كل الأرقام</button><button type="button" data-m="id" aria-pressed="false" data-k="wOne">موظف واحد</button><button type="button" data-m="date" aria-pressed="false" data-k="wDate">تاريخ محدد</button></div>
<div class="row"><input id="wid" list="wnames" hidden data-kp="wIdPh" placeholder="الرقم الوظيفي أو الاسم" autocomplete="off"><datalist id="wnames"></datalist><input id="wdate" type="date" hidden></div>
<div class="row"><input id="wcode" type="password" inputmode="numeric" autocomplete="off" dir="ltr" data-kp="wCodePh" placeholder="الرمز السري للتأكيد"><button class="btn red" id="wgo" type="button" data-k="wCheck">معاينة</button><button class="btn" id="wcancel" type="button" data-k="wCancel">إلغاء</button></div>
<p class="msg" id="wmsg" role="status"></p>
</section>
<div id="warn" class="warn" hidden data-k="warn">الاتصال بـ Firebase غير مُفعَّل بعد، لذلك لا توجد بيانات.</div>
<div class="stats" id="stats"></div>
<nav role="tablist" id="tabs">
<button role="tab" data-t="top" aria-selected="true" data-k="t_top">الأرقام القياسية</button>
<button role="tab" data-t="logins" aria-selected="false" data-k="t_logins">سجل الدخول</button>
<button role="tab" data-t="scores" aria-selected="false" data-k="t_scores">كل النتائج</button>
<button role="tab" data-t="guests" aria-selected="false" data-k="t_guests">الضيوف</button>
<button role="tab" data-t="absent" aria-selected="false" data-k="t_absent">لم يدخلوا بعد</button>
</nav>
<div class="tools"><input id="q" type="search" data-kp="search" placeholder="ابحث بالاسم أو الرقم الوظيفي أو القسم"></div>
<div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
</section>
</main>
<script src="game/online.js"></script>
<script>
/* الرمز السري يُقارَن ببصمته فقط (SHA-256). هذه حماية واجهة بسيطة وليست حماية خادم. */
const HASH = '6547f192c1fda3b27eeff6606ea172480774cd0f6de3b6e955f47e7037c4d8ad', SK = 'acg_admin';
const $ = id => document.getElementById(id);
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
const fmt = d => d ? new Intl.DateTimeFormat(L[lang].loc, { dateStyle: 'short', timeStyle: 'short' }).format(d) : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const L = {
 ar: { title:'لوحة الإدارة', gate:'أدخل الرمز السري للإدارة', enter:'دخول', refresh:'تحديث', lock:'قفل', warn:'الاتصال بـ Firebase غير مُفعَّل بعد، لذلك لا توجد بيانات.', t_top:'الأرقام القياسية', t_logins:'سجل الدخول', t_scores:'كل النتائج', t_absent:'لم يدخلوا بعد', search:'ابحث بالاسم أو الرقم الوظيفي أو القسم',
  wipeBtn:'مسح الأرقام', wipeT:'مسح الأرقام القياسية', wipeP:'عملية نهائية لا يمكن التراجع عنها. تتطلب إدخال الرمز السري من جديد.', wAll:'كل الأرقام', wOne:'موظف واحد', wDate:'تاريخ محدد', wIdPh:'الرقم الوظيفي أو الاسم', wCodePh:'الرمز السري للتأكيد', wCheck:'معاينة', wCancel:'إلغاء', wConfirm:'حذف نهائي', wNoCfg:'Firebase غير مُفعَّل', wBadCode:'الرمز غير صحيح أو حساب المدير غير مُنشأ في Firebase', wNoEmp:'اختر موظفاً صحيحاً', wNoDate:'اختر تاريخاً', wNothing:'لا توجد أرقام مطابقة للمسح', wPlan:(a,b)=>`سيُحذف ${a} سجل نتيجة ويُعاد ضبط ${b} رقم قياسي. اضغط «حذف نهائي» للتأكيد.`, wDone:n=>`تم المسح (${n} عملية)`, wFail:'تعذّر المسح — تحقّق من قواعد Firebase', wTrunc:' (يُعالَج آخر 1000 نتيجة فقط)',
  bad:'الرمز غير صحيح', loading:'جارٍ التحميل…', upd:'آخر تحديث: ', fail:'تعذّر الاتصال بقاعدة البيانات', s_seen:'موظفون دخلوا اللعبة', s_today:'دخلوا اليوم', s_plays:'مرات اللعب', s_best:'أعلى رقم', s_bestby:'أعلى رقم — ', none:'لا توجد بيانات', s_guests:'ضيوف لعبوا بلا حساب', guest:'ضيف', g_mobile:'ضيف بلا حساب · جوال', g_desktop:'ضيف بلا حساب · حاسوب', t_guests:'الضيوف',
  h_name:'الاسم', h_id:'الرقم', h_dept:'القسم', h_best:'أفضل نتيجة', h_plays:'مرات اللعب', h_time:'الوقت', h_score:'النتيجة', loc:'ar-OM-u-nu-latn', btn:'EN' },
 en: { title:'Admin Panel', gate:'Enter the admin passcode', enter:'Sign in', refresh:'Refresh', lock:'Lock', warn:'Firebase is not connected yet, so there is no data.', t_top:'Leaderboard', t_logins:'Login log', t_scores:'All scores', t_absent:'Not yet joined', search:'Search by name, employee ID or department',
  wipeBtn:'Reset records', wipeT:'Reset records', wipeP:'This is permanent and cannot be undone. You must enter the passcode again.', wAll:'All records', wOne:'One employee', wDate:'A specific date', wIdPh:'Employee ID or name', wCodePh:'Passcode to confirm', wCheck:'Preview', wCancel:'Cancel', wConfirm:'Delete permanently', wNoCfg:'Firebase is not connected', wBadCode:'Wrong passcode, or the admin account is not set up in Firebase', wNoEmp:'Pick a valid employee', wNoDate:'Pick a date', wNothing:'Nothing matches to reset', wPlan:(a,b)=>`This will delete ${a} score entries and reset ${b} records. Press “Delete permanently” to confirm.`, wDone:n=>`Reset complete (${n} operations)`, wFail:'Reset failed — check the Firebase rules', wTrunc:' (only the latest 1000 scores are processed)',
  bad:'Wrong passcode', loading:'Loading…', upd:'Last updated: ', fail:'Could not reach the database', s_seen:'Employees who joined', s_today:'Joined today', s_plays:'Games played', s_best:'Top score', s_bestby:'Top score — ', none:'No data', s_guests:'Guests who played without an account', guest:'Guest', g_mobile:'Guest, no account · phone', g_desktop:'Guest, no account · computer', t_guests:'Guests',
  h_name:'Name', h_id:'ID', h_dept:'Department', h_best:'Best score', h_plays:'Games', h_time:'Time', h_score:'Score', loc:'en-GB', btn:'العربية' }
};
let lang = 'ar'; try { lang = localStorage.getItem('acg_admin_lang') === 'en' ? 'en' : 'ar'; } catch(e){}
const tr = k => L[lang][k];
function applyLang(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl'; document.title = tr('title') + ' — Air Cargo';
  document.querySelectorAll('[data-k]').forEach(e => e.textContent = tr(e.dataset.k));
  document.querySelectorAll('[data-kp]').forEach(e => e.placeholder = tr(e.dataset.kp));
  $('lang').textContent = tr('btn');
}
let D = { players: [], logins: [], scores: [], dir: {} }, tab = 'top';

async function unlock(code){ if(await sha('acg|' + code) !== HASH) return false; try { sessionStorage.setItem(SK, HASH); } catch(e){} $('gate').hidden = true; $('app').hidden = false; load(); return true; }
$('gf').onsubmit = async e => { e.preventDefault(); $('gerr').textContent = (await unlock($('code').value.trim())) ? '' : 'الرمز غير صحيح'; };
$('lock').onclick = () => { try { sessionStorage.removeItem(SK); } catch(e){} location.reload(); };
$('refresh').onclick = () => load();

async function load(){
  $('upd').textContent = tr('loading');
  D.dir = await Online.directory();
  $('warn').hidden = Online.enabled();
  try { const [p, l, s] = await Promise.all([Online.players(1000), Online.logins(500), Online.scores(500)]); D.players = p; D.logins = l; D.scores = s; $('upd').textContent = tr('upd') + fmt(new Date()); }
  catch(e){ $('upd').textContent = 'تعذّر الاتصال بقاعدة البيانات'; }
  render();
}
function render(){
  /* الضيوف (G-xxxxxx) يظهرون في كل السجلات بوسم «ضيف» ونوع الجهاز */
  const G = r => Online.isGuest(r.id);
  const nm = r => G(r) ? tr('guest') + ' #' + String(r.id).slice(2) : Online.nameOf(r.id, lang, r.name);
  const dp = r => G(r) ? tr(/mobile/.test(r.dept) ? 'g_mobile' : 'g_desktop') : Online.deptOf(r.id, lang, r.dept);
  const total = Object.keys(D.dir).length, seen = D.players.filter(p => !G(p)).length, guests = D.players.filter(G), today = new Date().toDateString();
  const todayN = new Set(D.logins.filter(x => x.at && x.at.toDateString() === today).map(x => x.id)).size;
  const best = D.players.slice().sort((a, b) => b.best - a.best)[0];
  const plays = D.players.reduce((n, p) => n + (p.plays || 0), 0);
  $('stats').innerHTML = [['hot', seen + ' / ' + total, tr('s_seen')], ['ok', todayN, tr('s_today')], ['', plays, tr('s_plays')], ['', guests.length, tr('s_guests')], ['gold', best && best.best > 0 ? best.best : '—', best && best.best > 0 ? tr('s_bestby') + esc(nm(best)) : tr('s_best')]]
    .map(([c, n, l]) => `<div class="stat ${c}"><b>${n}</b><span>${l}</span></div>`).join('');
  const q = $('q').value.trim().toLowerCase(), hit = r => !q || (Object.values(r).join(' ') + ' ' + nm(r) + ' ' + dp(r)).toLowerCase().includes(q);
  const T = {
    top: [['#', tr('h_name'), tr('h_id'), tr('h_dept'), tr('h_best'), tr('h_plays')], () => D.players.filter(p => p.best > 0).sort((a, b) => b.best - a.best).filter(hit).map((p, i) => [i + 1, nm(p), p.id, dp(p), p.best, p.plays], i => i === 0)],
    logins: [[tr('h_time'), tr('h_name'), tr('h_id'), tr('h_dept')], () => D.logins.filter(hit).map(l => [fmt(l.at), nm(l), l.id, dp(l)])],
    scores: [[tr('h_time'), tr('h_name'), tr('h_id'), tr('h_dept'), tr('h_score')], () => D.scores.filter(hit).map(s => [fmt(s.at), nm(s), s.id, dp(s), s.score])],
    guests: [[tr('h_name'), tr('h_dept'), tr('h_best'), tr('h_plays'), tr('h_time')], () => guests.slice().sort((a, b) => (b.last || 0) - (a.last || 0)).filter(hit).map(p => [nm(p), dp(p), p.best, p.plays, fmt(p.last)])],
    absent: [[tr('h_name'), tr('h_id'), tr('h_dept')], () => { const have = new Set(D.players.map(p => p.id)); return Object.entries(D.dir).filter(([id]) => !have.has(id)).map(([id, v]) => ({ id, name: v[0], dept: v[1] })).filter(hit).map(r => [nm(r), r.id, dp(r)]); }]
  }[tab];
  const rows = T[1](), numCol = { top: [2, 4, 5], logins: [2], scores: [2, 4], guests: [2, 3], absent: [1] }[tab];
  $('th').innerHTML = '<tr>' + T[0].map(h => `<th>${h}</th>`).join('') + '</tr>';
  $('tb').innerHTML = rows.length ? rows.map(r => `<tr${tab === 'top' && r[0] === 1 ? ' class="top1"' : ''}>` + r.map((c, i) => `<td data-l="${esc(T[0][i])}" class="${numCol.includes(i) ? 'n' : ''}${tab === 'top' && i === 0 ? ' rk' : ''}">${esc(c)}</td>`).join('') + '</tr>').join('') : `<tr><td class="empty" colspan="${T[0].length}">${tr('none')}</td></tr>`;
}
$('tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; tab = b.dataset.t; [...$('tabs').children].forEach(x => x.setAttribute('aria-selected', x === b)); render(); };
$('q').oninput = render;
$('lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('acg_admin_lang', lang); } catch(e){} applyLang(); $('upd').textContent = tr('upd') + fmt(new Date()); render(); };

/* ===== مسح الأرقام القياسية ===== */
let wmode = 'all', wplan = null;
const wmsg = (t, c) => { $('wmsg').textContent = t || ''; $('wmsg').className = 'msg' + (c ? ' ' + c : ''); };
function wreset(){ wplan = null; $('wgo').textContent = tr('wCheck'); $('wgo').dataset.k = 'wCheck'; $('wcode').value = ''; wmsg(''); }
function wmodeSet(m){ wmode = m; [...$('wmodes').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m)); $('wid').hidden = m !== 'id'; $('wdate').hidden = m !== 'date'; wplan = null; $('wgo').dataset.k = 'wCheck'; $('wgo').textContent = tr('wCheck'); wmsg(''); }
$('wipeBtn').onclick = () => { const w = $('wipe'); w.hidden = !w.hidden; if(!w.hidden){ wmodeSet('all'); wreset(); $('wnames').innerHTML = Object.entries(D.dir).map(([id, v]) => `<option value="${id}">${esc(lang === 'en' ? v[0] : v[2] || v[0])}</option>`).join(''); } };
$('wcancel').onclick = () => { $('wipe').hidden = true; wreset(); };
$('wmodes').onclick = e => { const b = e.target.closest('button'); if(b) wmodeSet(b.dataset.m); };
function empId(v){ v = v.trim(); if(D.dir[v]) return v; const hit = Object.entries(D.dir).find(([id, r]) => r[0].toLowerCase() === v.toLowerCase() || r[2] === v); return hit ? hit[0] : null; }
$('wgo').onclick = async () => {
  if(!Online.enabled()) return wmsg(tr('wNoCfg'), 'err');
  const o = { mode: wmode };
  if(wmode === 'id'){ o.id = empId($('wid').value); if(!o.id) return wmsg(tr('wNoEmp'), 'err'); }
  if(wmode === 'date'){ o.date = $('wdate').value; if(!o.date) return wmsg(tr('wNoDate'), 'err'); }
  $('wgo').disabled = true;
  try {
    if(!wplan){
      try { await Online.adminLogin($('wcode').value.trim()); } catch(e){ return wmsg(tr('wBadCode'), 'err'); }
      const p = await Online.planWipe(o);
      if(!p.del.length && !p.upd.length) return wmsg(tr('wNothing'), 'err');
      wplan = p; $('wgo').textContent = tr('wConfirm'); $('wgo').dataset.k = 'wConfirm';
      wmsg(tr('wPlan')(p.del.length, p.upd.length) + (p.truncated ? tr('wTrunc') : ''));
    } else {
      const n = await Online.runWipe(wplan); wplan = null; wmsg(tr('wDone')(n), 'ok'); $('wgo').textContent = tr('wCheck'); $('wgo').dataset.k = 'wCheck'; $('wcode').value = ''; load();
    }
  } catch(e){ wmsg(tr('wFail'), 'err'); } finally { $('wgo').disabled = false; }
};
applyLang();
try { if(sessionStorage.getItem(SK) === HASH){ $('gate').hidden = true; $('app').hidden = false; load(); } } catch(e){}
</script>
</body>
</html>
