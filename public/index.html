<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مستودع الشحن الجوي 3D — IATA DGR</title>
<meta name="description" content="لعبة ثلاثية الأبعاد لفرز شحنات المواد الخطرة وفق IATA DGR: التقط، افحص، افرز، وقُد الرافعة الشوكية.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a121c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مستودع الشحن">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{
  font-family:'Cairo';font-style:normal;font-weight:500 900;font-display:swap;
  src:url(vendor/fonts/cairo-arabic.woff2) format('woff2');
  unicode-range:U+0600-06FF,U+0750-077F,U+0870-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC;
}
@font-face{
  font-family:'Cairo';font-style:normal;font-weight:500 900;font-display:swap;
  src:url(vendor/fonts/cairo-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:#dbe7f5;
  background:
    radial-gradient(1100px 620px at 50% -10%,#17334f 0%,rgba(9,18,30,0) 62%),
    radial-gradient(800px 500px at 88% 108%,rgba(255,167,38,.10) 0%,rgba(9,18,30,0) 60%),
    linear-gradient(180deg,#070d16 0%,#0a1522 55%,#060a11 100%);
  min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,1.8vh,20px);
  padding:clamp(10px,2.4vh,26px) clamp(10px,2.4vw,26px);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(120,180,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,255,.045) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 78%);
}
header{
  position:relative;z-index:1;
  width:min(1680px,96vw);
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:46px;height:46px;border-radius:13px;box-shadow:0 6px 18px rgba(0,0,0,.55);flex:0 0 auto}
.brand h1{margin:0;font-size:clamp(16px,2.2vw,23px);font-weight:900;letter-spacing:.2px;color:#f3f8ff}
.brand p{margin:2px 0 0;font-size:clamp(10.5px,1.3vw,12.5px);color:#8fa7c0}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:12px;border:1px solid rgba(140,200,255,.26);
  color:#e8f2ff;background:linear-gradient(180deg,rgba(38,66,96,.95),rgba(18,32,48,.95));
  box-shadow:0 8px 20px rgba(0,0,0,.4);transition:transform .15s ease,border-color .15s ease;
}
.btn:hover{transform:translateY(-1px);border-color:rgba(140,200,255,.5)}
.btn.gold{
  color:#241802;border-color:rgba(255,213,74,.65);
  background:linear-gradient(180deg,#ffd968,#f0a200);
  box-shadow:0 8px 22px rgba(240,162,0,.28);
}
.btn svg{width:15px;height:15px}
.btn[hidden]{display:none!important}
.frame-wrap{position:relative;z-index:1;width:min(1680px,96vw);display:flex;flex-direction:column;gap:8px}
.frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  max-height:calc(100dvh - 190px);
  padding:clamp(6px,.9vw,11px);
  border-radius:clamp(16px,2vw,26px);
  background:linear-gradient(160deg,#22364d,#101c2b 42%,#0a1220);
  border:1px solid rgba(150,205,255,.22);
  box-shadow:
    0 34px 90px rgba(0,0,0,.72),
    0 0 0 1px rgba(0,0,0,.6),
    0 0 52px rgba(58,160,255,.14),
    inset 0 1px 0 rgba(255,255,255,.08);
}
.frame::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 22%);
  mix-blend-mode:screen;opacity:.5;
}
.frame iframe{
  display:block;width:100%;height:100%;
  border:0;border-radius:clamp(10px,1.4vw,18px);
  background:#0a121c;
  box-shadow:0 0 0 1px rgba(0,0,0,.75), inset 0 0 40px rgba(0,0,0,.6);
}
.caption{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:11.5px;color:#7f96ae;padding:0 6px;
}
.caption .dot{display:inline-flex;align-items:center;gap:6px}
.caption i{width:7px;height:7px;border-radius:50%;background:#3ddc97;box-shadow:0 0 8px #3ddc97;display:inline-block}
.ios-note{display:none;font-size:11.5px;color:#c9a25a}
body.ios .ios-note{display:inline}
@media (max-width:820px){
  body{padding:0;gap:0;justify-content:flex-start}
  header{position:absolute;top:0;inset-inline:0;z-index:3;padding:8px 10px;background:linear-gradient(180deg,rgba(6,12,20,.9),transparent);pointer-events:none}
  header .brand img{width:34px;height:34px;border-radius:10px}
  header .brand h1{font-size:13px}
  header .brand p{display:none}
  .actions{pointer-events:auto}
  .actions .btn{padding:7px 12px;font-size:11.5px}
  .frame-wrap{width:100%;height:100dvh;gap:0}
  .frame{
    aspect-ratio:auto;height:100dvh;max-height:none;padding:0;border:0;border-radius:0;box-shadow:none;
  }
  .frame iframe{border-radius:0}
  .caption{display:none}
}
@media (max-height:560px) and (orientation:landscape){
  header{display:none}
  body{justify-content:flex-start;padding:0}
  .frame-wrap{width:100%;height:100dvh}
  .frame{aspect-ratio:auto;height:100dvh;max-height:none;padding:0;border:0;border-radius:0}
  .frame iframe{border-radius:0}
  .caption{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="icons/icon-192.png" alt="شعار اللعبة" width="46" height="46">
    <div>
      <h1>مستودع الشحن الجوي 3D</h1>
      <p>فرز المواد الخطرة IATA DGR · تدريب تفاعلي</p>
    </div>
  </div>
  <div class="actions">
    <button class="btn gold" id="install" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
      <span>تثبيت اللعبة</span>
    </button>
    <button class="btn" id="full" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
      <span>ملء الشاشة</span>
    </button>
  </div>
</header>

<div class="frame-wrap">
  <div class="frame" id="frame">
    <iframe id="game" src="game.html" title="لعبة مستودع الشحن الجوي" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
  </div>
  <div class="caption">
    <span class="dot"><i></i>اللعبة تعمل داخل إطار — اضغط داخل الإطار لتفعيل لوحة المفاتيح</span>
    <span class="ios-note">للتثبيت على iPhone: زر المشاركة ← إضافة إلى الشاشة الرئيسية</span>
  </div>
</div>

<script>
if (/iPhone|iPad|iPod/.test(navigator.userAgent)) document.body.classList.add('ios');

const frame = document.getElementById('frame');
const game = document.getElementById('game');
const installBtn = document.getElementById('install');
let deferredPrompt = null;

document.getElementById('full').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (frame.requestFullscreen) frame.requestFullscreen();
});

addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredPrompt = event;
  installBtn.hidden = false;
});
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  installBtn.hidden = true;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});
addEventListener('appinstalled', () => { installBtn.hidden = true; deferredPrompt = null; });

game.addEventListener('load', () => {
  try { game.contentWindow.focus(); } catch (e) {}
});

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
