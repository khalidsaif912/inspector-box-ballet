<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<script>try{document.documentElement.setAttribute("data-theme", localStorage.getItem("dgr-theme") || "dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}</script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../favicon.ico">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#070B14"/>
<title>قرائن الصور</title>

<style>
:root{
  --bg0:#070B14; --bg1:#0B1220;
  --stroke:rgba(255,255,255,.12);
  --text:#EEF3FF;
  --muted:rgba(238,243,255,.72);
  --shadow:0 18px 55px rgba(0,0,0,.45);
  --card-back:url('card-back.png');
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial}
html,body{height:100%;margin:0;overflow:hidden}
body{
  color:var(--text);
  background:
    radial-gradient(920px 520px at 12% 8%, rgba(79,172,254,.14), transparent 58%),
    linear-gradient(180deg, var(--bg0), var(--bg1));
}

/* ===== Desktop Layout ===== */
.app{position:fixed;inset:0;display:grid;grid-template-columns:260px 1fr}
.sidebar{padding:14px}
.sbox{
  height:100%;border-radius:28px;border:1px solid var(--stroke);
  background:linear-gradient(180deg, rgba(18,28,48,.94), rgba(8,14,26,.88));
  box-shadow:var(--shadow);
  padding:14px;display:flex;flex-direction:column;gap:12px;
}
.brand{
  display:flex;flex-direction:column;gap:4px;padding:10px 12px;
  border-radius:20px;border:1px solid rgba(255,255,255,.10);
  background:rgba(5,10,20,.35);
}
.brand .appname{font-size:12px;color:var(--muted)}
.brand .title{font-size:16px;font-weight:900;letter-spacing:.2px}

.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.iconBtn{
  width:40px;height:40px;border-radius:16px;
  border:1px solid var(--stroke);background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-decoration:none;font-size:22px;
  transition:transform .12s ease;-webkit-tap-highlight-color:transparent;
}
.iconBtn:hover{background:rgba(255,255,255,.07)}
.iconBtn:active{transform:scale(.97)}

.pills{display:flex;gap:8px}
.pill{
  flex:1;height:42px;border-radius:16px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;font-size:18px;
}
.pill.active{box-shadow:0 0 0 2px rgba(79,172,254,.35) inset}

.timer{
  padding:14px;border-radius:22px;border:1px solid rgba(255,255,255,.10);
  background:rgba(5,10,20,.35);
}
.timer .lbl{font-size:12px;color:var(--muted);margin-bottom:8px}
.timer .val{
  font-variant-numeric:tabular-nums;font-size:46px;font-weight:950;
  letter-spacing:1px;text-align:center;padding:10px;
  border-radius:18px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.04);
}
.timer .val.pulse{animation:glow 1.15s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:0 0 0 rgba(79,172,254,0)}50%{text-shadow:0 0 22px rgba(79,172,254,.55)}}
.kv{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.kv span{font-size:12px;color:var(--muted)}
.kv strong{font-size:18px}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{
  height:46px;border-radius:16px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:22px;
}
.act:active{transform:scale(.98)}

.spacer{flex:1}
.note{font-size:12px;color:var(--muted);text-align:center;padding:8px 6px}

/* ===== Main Game Area ===== */
main{
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  overflow:hidden;
}


/* ===== Character Panel (Desktop) ===== */
.playArea{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
}
.charPanel{
  display:none;            /* يظهر فقط في الشاشات الكبيرة */
  flex:0 0 260px;
  width:260px;
  align-items:flex-end;
  justify-content:center;
  pointer-events:none;
  user-select:none;
}
.charPanel img{
  width:100%;
  height:auto;
  max-height:calc(100vh - 2cm - 40px);
  object-fit:contain;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.45));
}

/* ✅ تمركز + فراغ 1 سم أعلى وأسفل بدون التلاصق */
.stage{
  width:100%;
  max-width:900px;
  padding-top: 1cm;
  padding-bottom: 1cm;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ✅ شبكة مربعات + تمركز في الوسط (أفقي وعمودي) */
.grid{
  --cell: 120px;
  display:grid;
  grid-template-columns:repeat(4, var(--cell));
  grid-auto-rows: var(--cell);
  gap:12px;
  justify-content:center;
  align-content:center;
}

/* ===== Cards ===== */
.card{
  width:100%;
  height:auto;
  aspect-ratio: 1 / 1;
  perspective:1100px;
  cursor:pointer;
  position:relative
}
.inner{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  transition:transform .25s cubic-bezier(.2,.9,.2,1);
}
.card.flipped .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:18px;
  border:1px solid var(--stroke);
  background:rgba(255,255,255,.04);
  box-shadow:0 10px 25px rgba(0,0,0,.25);
  backface-visibility:hidden;overflow:hidden;
}
.face::after{
  content:"";position:absolute;inset:-2px;
  background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,.12) 35%, transparent 60%);
  transform:translateX(-80%) rotate(10deg);opacity:.22;
}
.card:hover .face::after{animation:shine 1.2s ease-in-out}
@keyframes shine{0%{transform:translateX(-80%) rotate(10deg)}100%{transform:translateX(80%) rotate(10deg)}}
.front{
  background:
    radial-gradient(400px 240px at 30% 25%, rgba(79,172,254,.18), transparent 55%),
    radial-gradient(340px 200px at 80% 80%, rgba(0,242,254,.12), transparent 55%),
    var(--card-back) center/44% no-repeat,
    rgba(255,255,255,.035);
}
.back{
  transform:rotateY(180deg);
  background:radial-gradient(420px 260px at 25% 30%, rgba(255,255,255,.06), transparent 60%), rgba(10,16,32,.55);
  display:flex;align-items:center;justify-content:center;
}
.imgBox{
  width:82%;height:82%;border-radius:14px;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.10);
  overflow:hidden;
}
.imgBox img{width:100%;height:100%;object-fit:contain;display:block}
.card.matched .face{border-color:rgba(79,172,254,.35)}
.card.matched::before{
  content:"";position:absolute;inset:-1px;border-radius:22px;z-index:-1;
  background:var(--pair-gradient);opacity:.9;
}
.card.match-anim .inner{animation:pop .28s ease-out}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}65%{transform:rotateY(180deg) scale(1.10)}100%{transform:rotateY(180deg) scale(1)}}

/* ===== Modal ===== */
.modal{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  z-index:90;padding:16px;background:rgba(0,0,0,.55);
}
.modal.show{display:flex}
.cardModal{
  width:min(640px,94vw);border-radius:24px;border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(180deg, rgba(18,28,48,.94), rgba(8,14,26,.88));
  box-shadow:var(--shadow);padding:16px;
}
.modalHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.modalHeader h2{margin:0;font-size:16px}
.xbtn{
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);
  color:var(--text);border-radius:16px;padding:8px 12px;cursor:pointer;
}
.small{color:var(--muted);font-size:13px}
.inputRow{display:flex;gap:10px;margin:12px 0}
.inputRow input{
  flex:1;border-radius:16px;border:1px solid var(--stroke);
  background:rgba(5,10,20,.35);color:var(--text);padding:12px 14px;
  font-size:14px;outline:none;
}
.primary{
  border-radius:16px;border:1px solid var(--stroke);
  background:rgba(79,172,254,.18);color:var(--text);
  padding:12px 14px;cursor:pointer;white-space:nowrap;
}
.table{
  width:100%;border-collapse:collapse;font-size:13px;
  overflow:hidden;border-radius:16px;border:1px solid rgba(255,255,255,.10);
}
.table th,.table td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center}
.table th{color:var(--muted);font-weight:700}

/* ===== Mobile Bars ===== */
.mTop,.mBottom{display:none}
.mTop{
  position:fixed;left:10px;right:10px;top:10px;z-index:60;
  height:54px;border-radius:22px;border:1px solid var(--stroke);
  background:linear-gradient(180deg, rgba(18,28,48,.94), rgba(8,14,26,.88));
  box-shadow:0 14px 40px rgba(0,0,0,.40);
  align-items:center;justify-content:space-between;padding:10px 12px;
}
.mTitle{font-weight:900;font-size:15px;letter-spacing:.2px}
.mTopActions{display:flex;align-items:center;gap:8px}
.mBtn,.mIcon{
  width:36px;height:36px;border-radius:12px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text);font-size:20px;
  -webkit-tap-highlight-color:transparent;
}
.mBtn:active,.mIcon:active{transform:scale(.97)}

.mBottom{
  position:fixed;left:10px;right:10px;bottom:10px;
  padding-bottom:calc(env(safe-area-inset-bottom));z-index:60;
  height:64px;border-radius:24px;border:1px solid var(--stroke);
  background:linear-gradient(180deg, rgba(18,28,48,.94), rgba(8,14,26,.88));
  box-shadow:0 14px 40px rgba(0,0,0,.40);
  align-items:center;justify-content:space-between;padding:10px 12px;
}
.mStat{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:88px}
.mLbl{font-size:11px;color:var(--muted)}
.mVal{font-variant-numeric:tabular-nums;font-size:18px;font-weight:950}

/* ===== Responsive ===== */
/* تظهر فقط في الشاشات الكبيرة */
@media (min-width: 1024px){
  .charPanel{display:flex;}
  .sidebar{ position:relative; }
  .charPanel{
    display:flex;
    justify-content:center;
    width:100%;
    margin:18px 0 -40px 0;   /* خلف الطاولة */
    z-index:1;
    pointer-events:none;
  }
  .timer{ position:relative; z-index:3; }
}
@media (min-width: 1600px){
  .grid{
    --cell: clamp(150px, 7vw, 200px);
    gap:14px;
  }
}
@media (max-width: 720px){
  .sidebar{display:none}
  .app{grid-template-columns:1fr}

  main{
    padding:8px;
    min-height:100vh;
    min-height:100dvh;
    padding-top:68px;
    padding-bottom:78px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .stage{
    max-width:none;
    width:100%;
    height:auto;
    padding-top:0;
    padding-bottom:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .mTop,.mBottom{display:flex}

  .grid{
    --cell: min(22vw, 92px);
    grid-template-columns:repeat(4, var(--cell));
    gap:6px;
    justify-content:center;
    align-content:center;
  }

  .face{border-radius:14px}
  .imgBox{width:85%;height:85%}
  .mBottom{height:58px}
  .mTop{height:48px}
  .mBtn,.mIcon{width:36px;height:36px;border-radius:12px;font-size:18px}
  .mStat{min-width:70px}
  .mVal{font-size:15px}
  .mLbl{font-size:10px}
}

/* هاتف أفقي/شاشة قصيرة: هوامش أصغر حتى لا تُقص الشبكة */
@media (max-width: 720px) and (orientation: landscape){
  main{padding-top:54px;padding-bottom:62px}
  .mTop{height:44px}
  .mBottom{height:52px}
}

/* شاشة عمودية عريضة (هاتف مطوي/تابلت صغير): تخطيط عمودي بلا شريط جانبي */
@media (min-width: 721px) and (max-width: 1023px) and (orientation: portrait){
  .sidebar{display:none}
  .app{grid-template-columns:1fr}
  .mTop,.mBottom{display:flex}
  main{
    padding:8px;
    padding-top:68px;
    padding-bottom:78px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
  }
  .stage{
    max-width:none;
    width:100%;
    height:auto;
    padding-top:0;
    padding-bottom:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .grid{gap:8px;justify-content:center;align-content:center}
  .face{border-radius:14px}
  .imgBox{width:85%;height:85%}
  .mBottom{height:58px}
  .mTop{height:48px}
  .mBtn,.mIcon{width:36px;height:36px;border-radius:12px;font-size:18px}
  .mStat{min-width:70px}
  .mVal{font-size:15px}
  .mLbl{font-size:10px}
}



/* ===== Character as Broadcaster (خلف الطاولة) ===== */

/* افتراضيًا مخفية */
.charPanel{
  display:none;
}

/* تظهر فقط في الشاشات الكبيرة */
@media (min-width: 1024px){
  .grid{
    /* ⬆️ تكبير واضح */
    --cell: clamp(140px, 8.5vw, 190px);
    grid-template-columns:repeat(5, var(--cell));
    gap:14px;
  }
}

  /* الشخصية */
  .charPanel{
    display:flex;
    justify-content:center;

    width:100%;
    margin:18px 0 -40px 0;   /* 👈 السطر السحري */
    z-index:1;              /* خلف الطاولة */
    pointer-events:none;    /* لا تتفاعل مع النقر */
  }

  .charPanel img{
    max-width:100%;
    max-height:240px;       /* حجم الرأس/الجسم */
    object-fit:contain;

    display:block;
    filter: drop-shadow(0 18px 36px rgba(0,0,0,.45));
  }

  /* الطاولة (الوقت) */
  .timer{
    position:relative;
    z-index:3;              /* أمام الشخصية */
  }
}
/* لا تعرض alt كعنصر مرئي، فقط امنع ظهور الصورة المكسورة */
.charPanel img{
  display:none;           /* مخفية حتى تحمل */
}
.charPanel img.is-ready{
  display:block;          /* تظهر بعد التحميل */
}













/* ===== نتيجة المرحلة ونظام النقاط الموحّد ===== */
.stageResult{
  display:flex;flex-direction:column;gap:8px;margin:10px 0 4px;padding:12px 14px;border-radius:16px;
  background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.32);
}
.stageResult[hidden]{display:none}
.srRow{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.srRow strong{font-size:18px;color:#fff}
.srStars{display:flex;gap:5px}
.srStars i{width:16px;height:16px;border-radius:3px;background:rgba(255,255,255,.14);display:block}
.srStars i.on{background:var(--accent,#fbbf24);box-shadow:0 0 10px rgba(251,191,36,.6)}
.srActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.srActions .primary,.srActions .ghost{
  flex:1 1 130px;height:40px;border-radius:12px;display:inline-flex;align-items:center;
  justify-content:center;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;
  font-family:inherit;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--text);
}
.srActions .primary{background:linear-gradient(135deg,#fcd34d,#f59e0b);color:#1a1204;border:none}

/* ===== الألعاب النارية ===== */
#fxCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none;display:none}

/* ===== شريط المراحل ===== */
.stage{
  flex-direction:column;
  gap:10px;
}
.stepper{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  position:relative;z-index:2;
}
.stepBtn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
  color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
  transition:.2s ease;
}
.stepBtn b{font-size:12.5px}
.stepBtn .dot{
  width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:10.5px;background:rgba(255,255,255,.10);color:#cbd5e1;
}
.stepBtn.active{
  color:#0b1220;border-color:transparent;
  background:linear-gradient(135deg,#fcd34d,#f59e0b);
  box-shadow:0 8px 20px rgba(245,158,11,.35);
}
.stepBtn.active .dot{background:rgba(11,18,32,.22);color:#3a2400}
.stepBtn.done{color:#a7f3d0;border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.10)}
.stepBtn.done .dot{background:rgba(52,211,153,.25);color:#6ee7b7}
.stepBtn.locked{opacity:.55;cursor:not-allowed}
.stepBtn:focus-visible{outline:2px solid #8fd0ff;outline-offset:2px}
@media (max-width:560px){
  .stepBtn{padding:6px 9px;font-size:10.5px;gap:4px}
  .stepBtn .lbl{display:none}
  .stepBtn .dot{width:16px;height:16px}
}

/* ===== البطاقات الخاصة (النجمة / الكشف) ===== */
.card.star:not(.mystery) .front{
  background:
    radial-gradient(circle at 50% 45%, rgba(255,210,0,.42), transparent 62%),
    rgba(255,255,255,.04);
}
.card.star:not(.mystery) .front::before{
  content:"⭐";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(24px,6vmin,52px);filter:drop-shadow(0 0 12px rgba(255,210,0,.85));
}
.card.star:not(.mystery) .front::after{display:none}
.card.star .back{
  background:radial-gradient(circle at 50% 45%, rgba(255,210,0,.30), rgba(10,16,32,.62));
  flex-direction:column;gap:4px;color:#ffe9a8;font-weight:900;font-size:11px;text-align:center;
}
.card.peek .back{
  background:radial-gradient(circle at 50% 45%, rgba(79,172,254,.32), rgba(10,16,32,.62));
  flex-direction:column;gap:4px;color:#c9ecff;font-weight:900;font-size:11px;text-align:center;
}
.card.special .back .starBig{font-size:clamp(22px,5vmin,46px);line-height:1;filter:drop-shadow(0 0 14px rgba(255,210,0,.9))}
.card.peek .back .starBig{filter:drop-shadow(0 0 14px rgba(79,172,254,.95))}
.card.mystery .front::before{display:none}
.card.claimed{opacity:.92;cursor:default}
.card.peeked .inner{transform:rotateY(180deg)}

/* ===== نافذة نهاية المرحلة / النصر ===== */
.stgTitle{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;color:var(--text)}
.stgSub{margin:2px 0 10px;font-size:12.5px;color:var(--muted)}
.stgStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stgStat{
  padding:9px 6px;border-radius:14px;text-align:center;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
}
.stgStat b{display:block;font-size:17px;color:#fff}
.stgStat span{font-size:11px;color:var(--muted)}
.stgStars{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}
.stgStars i{width:19px;height:19px;border-radius:4px;background:rgba(255,255,255,.14);display:block}
.stgStars i.on{background:linear-gradient(135deg,#fde68a,#f59e0b);box-shadow:0 0 12px rgba(251,191,36,.7)}
.stgTotal{
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 4px;
  padding:11px 14px;border-radius:16px;
  background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.34);
}
.stgTotal span{font-size:12.5px;color:#bae6fd}
.stgTotal b{font-size:21px;color:#e0f7ff}
.stgActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stgActions .primary,.stgActions .ghost{
  flex:1 1 140px;height:42px;border-radius:13px;display:inline-flex;align-items:center;
  justify-content:center;font-family:inherit;font-weight:800;font-size:13.5px;cursor:pointer;
  text-decoration:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--text);
}
.stgActions .primary{background:linear-gradient(135deg,#fcd34d,#f59e0b);color:#1a1204;border:none}
.stgActions .ghost:hover{background:rgba(255,255,255,.12)}

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

  // 🔐 Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyD4wKBL-frMWN9Cw7uJFsyaHCk963JRUuA",
    authDomain: "similarity-f2428.firebaseapp.com",
    projectId: "similarity-f2428",
    appId: "1:353323874706:web:7999c84682c30f6800694b",
    storageBucket: "similarity-f2428.firebasestorage.app",
    messagingSenderId: "353323874706",
    measurementId: "G-X5E3CC8RZF"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  async function ensureLogin(){
    if (auth.currentUser) return auth.currentUser;
    const cred = await signInAnonymously(auth);
    return cred.user;
  }

  // ✅ Save score (matches your Firestore rules)
  async function saveScoreToFirestore(playerName, timeSeconds, moves){
    const user = await ensureLogin();

    const doc = {
      playerName: String(playerName ?? "").trim().slice(0, 20) || "لاعب",
      timeSeconds: Math.trunc(Number(timeSeconds)),
      moves: Math.trunc(Number(moves)),
      pairsCount: 10,
      gameId: "pairs",
      createdAt: serverTimestamp(),
      uid: user.uid
    };

    // Basic guardrails (helps avoid rule failures)
    if (doc.timeSeconds < 1 || doc.timeSeconds > 3600) throw new Error("timeSeconds خارج النطاق");
    if (doc.moves < 1 || doc.moves > 999) throw new Error("moves خارج النطاق");

    const ref = await addDoc(collection(db, "scores"), doc);
    return ref.id;
  }

  // ✅ Fetch scores (order by createdAt only, then sort client-side to avoid composite index)
  async function fetchScores(){
    const q = query(collection(db, "scores"), orderBy("createdAt", "desc"), limit(200));
    const snap = await getDocs(q);
    const rows = [];
    snap.forEach(d => rows.push(d.data()));

    const filtered = rows.filter(r => r && r.gameId === "pairs");
    filtered.sort((a,b)=>{
      const ta = (typeof a.timeSeconds === "number") ? a.timeSeconds : 1e9;
      const tb = (typeof b.timeSeconds === "number") ? b.timeSeconds : 1e9;
      if (ta !== tb) return ta - tb;
      const ma = (typeof a.moves === "number") ? a.moves : 1e9;
      const mb = (typeof b.moves === "number") ? b.moves : 1e9;
      return ma - mb;
    });
    return filtered.slice(0, 20);
  }

  // 🌍 expose to non-module scripts
  window.saveScoreToFirestore = async (playerName, timeSeconds, moves) => {
    try{
      const id = await saveScoreToFirestore(playerName, timeSeconds, moves);
      console.log("✅ Saved score:", id);
      return { ok:true, id };
    }catch(e){
      console.error("❌ Save failed:", e);
      return { ok:false, error: e?.message || String(e) };
    }
  };

  window.fetchScores = async () => {
    try{
      const rows = await fetchScores();
      return { ok:true, rows };
    }catch(e){
      console.error("❌ Fetch failed:", e);
      return { ok:false, error: e?.message || String(e), rows: [] };
    }
  };

  console.log("✅ Firebase v9 ready");
</script>

<script>
const MANIFEST_URL="manifest.json";
const IMG_BASE="";

let grid,timeBig,movesBig,restartSide,soundSide,boardSide,gamesBtn,gamesModal,closeGames;
let boardModal,closeBoard,boardStatus,boardBody,playerNameEl,saveBtn;
let mGames,mRestart,mSound,mBoard,mTime,mMoves;
let first=null,second=null,lock=false;
let moves=0,matchedPairs=0;
let elapsedSeconds=0;
let startMs=0,timerId=null,running=false,pausedTotal=0;
let soundOn=true;
let lastResult={timeSeconds:null,moves:null};

// ===== المراحل التدريجية =====
const STAGE_CONFIG={
  1:{pairs:2,cards:4,cols:2,base:120,moves3:3,moves2:5,time3:10,time2:20,label:"المرحلة الأولى"},
  2:{pairs:4,cards:9,cols:3,base:260,star:true,moves3:7,moves2:11,time3:32,time2:55,label:"المرحلة الثانية"},
  3:{pairs:9,cards:20,cols:5,base:520,star:true,power:"random",mystery:true,moves3:16,moves2:26,time3:80,time2:135,label:"المرحلة الثالثة"}
};
const STAGE_IDS=["1","2","3"];
let currentStage=1;
let stageBonus=0;

// بطاقات المفاجأة
const POWER_META={
  peek:{icon:"🔍",title:"كشف بطاقتين"},
  xray:{icon:"👁️",title:"رؤية الأشعة"},
  freeze:{icon:"⌛",title:"تجميد الزمن"},
  magnet:{icon:"🪄",title:"المغناطيس"},
  chest:{icon:"🎁",title:"صندوق الحظ"}
};
const POWER_POOL=["peek","peek","xray","freeze","magnet","chest"];
function pickPower(){ return POWER_POOL[randInt(POWER_POOL.length)]; }

const pairGradients=[
  "linear-gradient(135deg,#4facfe,#00f2fe)",
  "linear-gradient(135deg,#a18cd1,#fbc2eb)",
  "linear-gradient(135deg,#43e97b,#38f9d7)",
  "linear-gradient(135deg,#f7971e,#ffd200)",
  "linear-gradient(135deg,#fa709a,#fee140)",
  "linear-gradient(135deg,#30cfd0,#330867)",
  "linear-gradient(135deg,#84fab0,#8fd3f4)",
  "linear-gradient(135deg,#667eea,#764ba2)",
  "linear-gradient(135deg,#f857a6,#ff5858)",
  "linear-gradient(135deg,#cfd9df,#e2ebf0)"
];
const usedGradients={};

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function randInt(max){
  if(max<=0)return 0;
  try{
    if(window.crypto?.getRandomValues){
      const lim=Math.floor(0xFFFFFFFF/max)*max;
      const buf=new Uint32Array(1);
      while(true){crypto.getRandomValues(buf);const x=buf[0];if(x<lim)return x%max}
    }
  }catch(e){}
  return Math.floor(Math.random()*max);
}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=randInt(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function pickK(arr,k){const a=arr.slice(),n=a.length,kk=Math.min(k,n);
  for(let i=0;i<kk;i++){const j=i+randInt(n-i);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,kk)}

function sizeGrid(){
  if(!grid) return;
  const mainEl=document.querySelector("main");
  const mainRect=mainEl.getBoundingClientRect();
  const ms=getComputedStyle(mainEl);
  const stageEl=grid.parentElement;
  const ss=getComputedStyle(stageEl);
  const gap=parseFloat(getComputedStyle(grid).gap)||10;
  const isDesktop=window.matchMedia('(min-width:1024px)').matches;
  const {cols,rows}=stageLayout();
  const stepper=document.getElementById("stepper");
  const reserved=(stepper?stepper.getBoundingClientRect().height+10:0)
    +parseFloat(ss.paddingTop||0)+parseFloat(ss.paddingBottom||0);
  const maxW=mainRect.width-parseFloat(ms.paddingLeft||0)-parseFloat(ms.paddingRight||0)-(isDesktop?0:16);
  const maxH=mainRect.height-parseFloat(ms.paddingTop||0)-parseFloat(ms.paddingBottom||0)-reserved;
  const cell=Math.max(52,Math.floor(Math.min((maxW-gap*(cols-1))/cols,(maxH-gap*(rows-1))/rows)));
  grid.style.setProperty("--cell",cell+"px");
  grid.style.gridTemplateColumns=`repeat(${cols}, ${cell}px)`;
  grid.style.width=(cell*cols+gap*(cols-1))+"px";
  grid.style.height=(cell*rows+gap*(rows-1))+"px";
}

function stageLayout(){
  const total=(grid&&grid.children.length)?grid.children.length:20;
  const portrait=window.innerHeight>=window.innerWidth;
  if(currentStage===1) return {cols:2,rows:2};
  if(currentStage===2) return {cols:3,rows:3};
  // الهاتف/الشاشة العمودية: شبكة عمودية (صفوف أكثر من أعمدة) — الأفقي: 5×4
  const cols=portrait?4:5;
  return {cols,rows:Math.max(1,Math.ceil(total/cols))};
}

function formatTime(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}

function startTimerIfNeeded(){
  if(running)return;
  running=true;
  timeBig.classList.add("pulse");
  startMs=Date.now();
  pausedTotal=0;
  elapsedSeconds=0;
  timeBig.textContent="00:00";
  if(mTime)mTime.textContent="00:00";
  timerId=setInterval(()=>{
    if(document.body.classList.contains("timer-frozen")) return;
    const sec=Math.floor((Date.now()-startMs-pausedTotal)/1000);
    const t=formatTime(Math.max(0,sec));
    timeBig.textContent=t;
    if(mTime)mTime.textContent=t;
  },250);
}

function stopTimer(){
  // احفظ الوقت قبل الإيقاف حتى لا يصبح 0 بعد running=false
  if (running) {
    elapsedSeconds = Math.max(1, Math.floor((Date.now() - startMs - pausedTotal) / 1000));
  }
  running=false;
  timeBig.classList.remove("pulse");
  if(timerId){clearInterval(timerId);timerId=null}
}

function getTimeSeconds(){
  return running ? Math.max(1, Math.floor((Date.now()-startMs-pausedTotal)/1000)) : elapsedSeconds;
}

// ===== تجميد الزمن =====
let freezeTimerId = null;
let freezeToken = 0;
function freezeClock(seconds){
  const ms = seconds * 1000;
  const from = Date.now();
  const myToken = ++freezeToken;
  document.body.classList.add("timer-frozen");
  clearInterval(freezeTimerId);
  freezeTimerId = setInterval(() => {
    const left = Math.ceil((ms - (Date.now() - from)) / 1000);
    if(left <= 0){
      clearInterval(freezeTimerId);
      freezeTimerId = null;
      document.body.classList.remove("timer-frozen");
      return;
    }
    if(mTime) mTime.textContent = "❄ " + left;
    timeBig.textContent = "❄ " + left;
  }, 200);
  setTimeout(() => {
    if(myToken !== freezeToken) return;
    pausedTotal += Date.now() - from;
    document.body.classList.remove("timer-frozen");
    if(freezeTimerId){ clearInterval(freezeTimerId); freezeTimerId = null; }
  }, ms);
}
function clearFreeze(){
  freezeToken++;
  if(freezeTimerId){ clearInterval(freezeTimerId); freezeTimerId = null; }
  document.body.classList.remove("timer-frozen");
}

const AudioCtx=window.AudioContext||window.webkitAudioContext;
let ctx;
function beep(freq=880,dur=0.08){
  if(!soundOn)return;
  try{
    ctx=ctx||new AudioCtx();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=freq;g.gain.value=0.05;
    o.connect(g).connect(ctx.destination);
    o.onended=()=>{try{o.disconnect();g.disconnect()}catch(e){}};
    o.start();o.stop(ctx.currentTime+dur);
  }catch(e){}
}

function syncSound(){
  const icon=soundOn?"🔊":"🔇";
  soundSide.textContent=icon;
  if(mSound)mSound.textContent=icon;
}

// ===== محرك أصوات اصطناعي (Web Audio) =====
const SoundFX = (() => {
  let noiseBuf = null;
  function ac(){
    if(!soundOn) return null;
    try{
      ctx = ctx || new AudioCtx();
      if(ctx.state === "suspended") ctx.resume();
      return ctx;
    }catch(e){ return null; }
  }
  function tone(opts){
    const a = ac();
    if(!a) return;
    const { type = "sine", from = 440, to = from, dur = 0.14, vol = 0.16, delay = 0 } = opts || {};
    const t0 = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(30, from), t0);
    if(to !== from) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination);
    o.onended = () => { try{ o.disconnect(); g.disconnect(); }catch(e){} };
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }
  function wood(){
    tone({ type: "triangle", from: 200, to: 90, dur: 0.13, vol: 0.13 });
  }
  return {
    flip(){ tone({ type: "triangle", from: 320, to: 150, dur: 0.08, vol: 0.09 }); },
    match(){ tone({ type: "sine", from: 523.25, dur: 0.16, vol: 0.13 }); tone({ type: "sine", from: 659.25, dur: 0.2, vol: 0.11, delay: 0.05 }); },
    error(){ wood(); },
    combo(level){
      const notes = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
      const f = notes[Math.min(Math.max(level - 1, 0), notes.length - 1)];
      tone({ type: "sine", from: f, to: f * 1.5, dur: 0.26, vol: 0.15 });
    },
    magic(){
      for(let i = 0; i < 4; i++) tone({ type: "sine", from: 600 + i * 220, dur: 0.15, vol: 0.10, delay: i * 0.07 });
    },
    freeze(){
      for(let i = 0; i < 3; i++) tone({ type: "sine", from: 1500 - i * 260, dur: 0.3, vol: 0.08, delay: i * 0.09 });
    },
    pop(){
      const a = ac();
      tone({ type: "square", from: 900, to: 220, dur: 0.16, vol: 0.10 });
      if(!a) return;
      try{
        if(!noiseBuf){
          noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.25), a.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for(let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
        }
        const src = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain();
        src.buffer = noiseBuf;
        bp.type = "bandpass"; bp.frequency.value = 2400; bp.Q.value = 0.8;
        g.gain.value = 0.14;
        src.connect(bp).connect(g).connect(a.destination);
        src.onended = () => { try{ src.disconnect(); bp.disconnect(); g.disconnect(); }catch(e){} };
        src.start();
      }catch(e){}
    }
  };
})();

// ===== الكومبو ومضاعفاته =====
const COMBO_MULT = [1, 1, 1.5, 2, 3, 4];
const COMBO_WORDS = ["", "", "رائع!", "مذهل!", "خارق!", "أسطوري!"];
let comboStreak = 0, comboMult = 1, matchTimes = [];
let frenzyUntil = 0, frenzyTimer = null, frenzyPill = null;
let pairPoints = 0;

function comboMultiplier(streak){
  return COMBO_MULT[Math.min(streak, COMBO_MULT.length - 1)] || 1;
}
function isFrenzy(){ return Date.now() < frenzyUntil; }
function floatText(x, y, text, color){
  const el = document.createElement("div");
  el.className = "floatText";
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.color = color || "#ffd200";
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function cardCenter(card){
  const r = card.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
function comboBadge(streak){
  const el = document.createElement("div");
  el.className = "comboBadge" + (streak >= 5 ? " hot" : "");
  el.textContent = "COMBO ×" + streak + " 🔥";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}
function shakeScreen(){
  document.body.classList.remove("shake");
  void document.body.offsetWidth;
  document.body.classList.add("shake");
  setTimeout(() => document.body.classList.remove("shake"), 420);
}
function mascotSay(text){
  let el = document.querySelector(".speechBubble");
  if(!el){ el = document.createElement("div"); el.className = "speechBubble"; document.body.appendChild(el); }
  el.textContent = text;
  requestAnimationFrame(() => el.classList.add("on"));
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 1800);
}

function awardMatchPoints(card){
  const cfg = STAGE_CONFIG[currentStage];
  const mult = comboMultiplier(comboStreak);
  const bonus = Math.round(10 * mult * (isFrenzy() ? 2 : 1));
  stageBonus += bonus;
  pairPoints += bonus;
  if(card){
    const c = cardCenter(card);
    floatText(c.x, c.y, "+" + bonus + (mult > 1 ? " ×" + mult : ""), isFrenzy() ? "#ff9a3c" : "#7ef0ff");
  }
  return bonus;
}

function registerMatch(card){
  const now = Date.now();
  comboStreak++;
  comboMult = comboMultiplier(comboStreak);
  matchTimes.push(now);
  if(matchTimes.length > 6) matchTimes.shift();
  awardMatchPoints(card);
  SoundFX.match();
  if(comboStreak > 1){
    SoundFX.combo(comboStreak);
    comboBadge(comboStreak);
    const word = COMBO_WORDS[Math.min(comboStreak, COMBO_WORDS.length - 1)];
    if(card){
      const c = cardCenter(card);
      floatText(c.x, c.y - 34, word, "#fde68a");
    }
    if(comboStreak >= 4) shakeScreen();
    if(comboStreak >= 5){
      mascotSay("استمر يا أسطورة! 🏆");
      for(let i = 0; i < 3; i++){
        setTimeout(() => FX.burst(window.innerWidth * (0.2 + Math.random() * 0.6), window.innerHeight * 0.25, 26, 4), i * 120);
      }
    }
  }
  // 3 مطابقات في أقل من 6 ثوانٍ → وضع الاشتعال
  const n = matchTimes.length;
  if(!isFrenzy() && n >= 3 && (now - matchTimes[n - 3]) < 6000) triggerFrenzy();
}

function breakCombo(){
  if(comboStreak >= 3){
    const c = { x: window.innerWidth / 2, y: window.innerHeight * 0.42 };
    floatText(c.x, c.y, "انقطع الكومبو!", "#ff6b6b");
  }
  comboStreak = 0;
  comboMult = 1;
  matchTimes = [];
}

function triggerFrenzy(){
  if(isFrenzy()) return;
  if(!running && elapsedSeconds === 0) return;
  frenzyUntil = Date.now() + 8000;
  document.body.classList.add("frenzy-mode");
  SoundFX.magic();
  SoundFX.pop();
  mascotSay("وضع الاشتعال! نقاط مضاعفة 🔥");
  window.setCharacterState && window.setCharacterState('win');
  shakeScreen();
  FX.burst(window.innerWidth / 2, window.innerHeight * 0.3, 60, 7);
  if(!frenzyPill){
    frenzyPill = document.createElement("div");
    frenzyPill.className = "frenzyPill";
    document.body.appendChild(frenzyPill);
  }
  clearInterval(frenzyTimer);
  frenzyTimer = setInterval(() => {
    const left = Math.ceil((frenzyUntil - Date.now()) / 1000);
    if(left <= 0){
      clearInterval(frenzyTimer);
      frenzyTimer = null;
      frenzyUntil = 0;
      document.body.classList.remove("frenzy-mode");
      if(frenzyPill) frenzyPill.remove();
      frenzyPill = null;
      return;
    }
    if(frenzyPill) frenzyPill.textContent = "🔥 مضاعف ×2 — " + left + "ث";
  }, 200);
}
function clearFrenzy(){
  clearInterval(frenzyTimer);
  frenzyTimer = null;
  frenzyUntil = 0;
  document.body.classList.remove("frenzy-mode");
  if(frenzyPill){ frenzyPill.remove(); frenzyPill = null; }
}

function toRootHref(href){
  if(!href || href==="#") return "#";
  if(/^https?:\/\//i.test(href)) return href;
  if(href.startsWith("/")) return href;
  return "../" + String(href).replace(/^\.?\/+/,"");
}

function escHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function renderGamesMenu(){
  const box = document.getElementById("gamesList");
  if(!box) return;
  box.innerHTML = '<div class="small">جاري تحميل القائمة...</div>';

    const data = await res.json();
    const games = Array.isArray(data?.games) ? data.games : [];
    if(!games.length) throw new Error("games.json فارغ");

    games.forEach(g=>{
      const id = String(g.id||"");
      const name = String(g.name||"لعبة");
      const icon = String(g.icon||"🎮");

      const status = String(g.status||"soon");
      const isHere = (CURRENT_GAME_ID && id===CURRENT_GAME_ID);

        box.insertAdjacentHTML("beforeend", `

            <div>${escHtml(icon)} ${escHtml(name)}</div>
            <small style="font-size:11px;color:var(--muted)">أنت هنا</small>
          </div>
        `);
      } else if(isLive){
        box.insertAdjacentHTML("beforeend", `
          <a class="pill" href="${escHtml(toRootHref(href))}" style="height:60px;flex-direction:column;gap:4px">
            <div>${escHtml(icon)} ${escHtml(name)}</div>
            <small style="font-size:11px;color:var(--muted)">${escHtml(note)}</small>
          </a>
        `);
      } else {
        box.insertAdjacentHTML("beforeend", `
          <div class="pill" style="height:60px;flex-direction:column;gap:4px;opacity:.55;cursor:not-allowed">
            <div>${escHtml(icon)} ${escHtml(name)}</div>

}

// ===== نظام المراحل التدريجي والنقاط المستقلة =====
const STAGE_ID = "pairs";
const PROGRESS_KEY = "dgr_pairs_progressive_data";
const MIN_STAGE_SCORE = 20;
let autoTimer = null;
let progressCache = null;

function stageNum(key){ return Number(key) || 0; }
function readProgress(){
  if(progressCache) return progressCache;
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "null"); }catch(e){ raw = null; }
  const clean = { totalCumulativeScore: 0, currentStage: 1, stages: {} };
  if(raw && typeof raw === "object"){
    clean.currentStage = Math.min(3, Math.max(1, Number(raw.currentStage) || 1));
    const stages = raw.stages && typeof raw.stages === "object" ? raw.stages : {};
    for(const key of STAGE_IDS){
      const s = stages[key];
      if(!s || typeof s !== "object") continue;
      clean.stages[key] = {
        name: String(s.name || (STAGE_CONFIG[stageNum(key)].label + " (" + STAGE_CONFIG[stageNum(key)].cards + " بطاقات)")),
        cardsCount: Number(s.cardsCount) || STAGE_CONFIG[stageNum(key)].cards,
        pairsCount: Number(s.pairsCount) || STAGE_CONFIG[stageNum(key)].pairs,
        bestScore: Math.max(0, Number(s.bestScore) || 0),
        bestTime: Math.max(0, Number(s.bestTime) || 0),
        bestMoves: Math.max(0, Number(s.bestMoves) || 0),
        stars: Math.min(3, Math.max(1, Number(s.stars) || 1)),
        completed: !!s.completed
      };
    }
  }
  clean.totalCumulativeScore = STAGE_IDS.reduce((sum, key) => sum + (clean.stages[key]?.bestScore || 0), 0);
  progressCache = clean;
  return clean;
}
function overallStars(data){
  const done = STAGE_IDS.map((key) => data.stages[key]).filter((s) => s && s.completed);
  if(!done.length) return 1;
  return Math.min(3, Math.max(1, Math.round(done.reduce((sum, s) => sum + s.stars, 0) / done.length)));
}
function syncHub(data){
  try{
    if(!window.GameHub) return;
    GameHub.setActiveGame(STAGE_ID);
    GameHub.saveGameScore(STAGE_ID, data.totalCumulativeScore, overallStars(data));
  }catch(e){}
}
function writeProgress(data){
  data.totalCumulativeScore = STAGE_IDS.reduce((sum, key) => sum + (data.stages[key]?.bestScore || 0), 0);
  progressCache = data;
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(data)); }catch(e){}
  syncHub(data);
  return data;
}
function saveStageScore(stageNumValue, score, timeSeconds, mv){
  const key = String(stageNumValue);
  const cfg = STAGE_CONFIG[stageNumValue];
  const data = readProgress();
  const prev = data.stages[key] || { bestScore: 0, bestTime: 0, bestMoves: 0, stars: 1 };
  const value = Math.max(MIN_STAGE_SCORE, Math.round(score));
  const stars = stageStars(stageNumValue, timeSeconds, mv);
  const isRecord = value > prev.bestScore;
  data.stages[key] = {
    name: cfg.label + " (" + cfg.cards + " بطاقات)",
    cardsCount: cfg.cards,
    pairsCount: cfg.pairs,
    bestScore: Math.max(prev.bestScore || 0, value),
    bestTime: isRecord || !prev.bestTime ? Math.max(1, Math.round(timeSeconds)) : prev.bestTime,
    bestMoves: isRecord || !prev.bestMoves ? mv : prev.bestMoves,
    stars: isRecord || !prev.stars ? Math.max(prev.stars || 1, stars) : prev.stars,
    completed: true
  };
  data.currentStage = Math.min(3, Math.max(data.currentStage || 1, stageNumValue));
  writeProgress(data);
  return { data, stage: data.stages[key], isRecord, total: data.totalCumulativeScore, stars };
}
function stageUnlocked(n, data){
  if(n <= 1) return true;
  const prev = (data || readProgress()).stages[String(n - 1)];
  return !!(prev && prev.completed);
}
function initialStage(){
  const data = readProgress();
  for(const n of [1, 2, 3]) if(!(data.stages[String(n)]?.completed)) return n;
  return 1;
}
function stageScore(stageNumValue, timeSeconds, mv){
  const cfg = STAGE_CONFIG[stageNumValue];
  const extra = Math.max(0, mv - cfg.pairs);
  const raw = cfg.base + stageBonus - Math.round(timeSeconds * 2) - extra * 3;
  return Math.max(MIN_STAGE_SCORE, Math.round(raw));
}
function stageStars(stageNumValue, timeSeconds, mv){
  const cfg = STAGE_CONFIG[stageNumValue];
  if(mv <= cfg.moves3 && timeSeconds <= cfg.time3) return 3;
  if(mv <= cfg.moves2 && timeSeconds <= cfg.time2) return 2;
  return 1;
}
function starMarkup(n){
  return [0, 1, 2].map((i) => `<i class="${i < n ? "on" : ""}"></i>`).join("");
}

// ===== محرك الألعاب النارية (Canvas خفيف) =====
const FX = (() => {
  const COLORS = ["#4facfe", "#00f2fe", "#ffd200", "#fbc2eb", "#38f9d7", "#ff4b4b"];
  let canvas = null, ctx2 = null, raf = 0, particles = [], running = false;
  function ensure(){
    if(!canvas) canvas = document.getElementById("fxCanvas");
    if(!canvas) return false;
    if(!ctx2) ctx2 = canvas.getContext("2d");
    resize();
    return true;
  }
  function resize(){
    if(!canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    if(ctx2) ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function burst(cx, cy, count, power){
    for(let i = 0; i < count; i++){
      const angle = Math.random() * Math.PI * 2;
      const speed = (0.5 + Math.random()) * power;
      particles.push({
        x: cx, y: cy,
        px: cx, py: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.008 + Math.random() * 0.012,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        size: 1.4 + Math.random() * 2.4
      });
    }
    if(!running) frame();
  }
  function frame(){
    if(!canvas || !ctx2) return;
    running = true;
    ctx2.clearRect(0, 0, window.innerWidth, window.innerHeight);
    ctx2.lineCap = "round";
    for(const p of particles){
      p.px = p.x; p.py = p.y;
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.075;
      p.vx *= 0.988; p.vy *= 0.988;
      p.life -= p.decay;
      if(p.life <= 0) continue;
      ctx2.globalAlpha = Math.max(0, p.life);
      ctx2.strokeStyle = p.color;
      ctx2.lineWidth = p.size;
      ctx2.beginPath();
      ctx2.moveTo(p.px, p.py);
      ctx2.lineTo(p.x, p.y);
      ctx2.stroke();
    }
    particles = particles.filter((p) => p.life > 0);
    if(particles.length){
      raf = requestAnimationFrame(frame);
    }else{
      running = false;
      cancelAnimationFrame(raf);
      raf = 0;
      canvas.style.display = "none";
      ctx2.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }
  }
  function launch(kind){
    if(!ensure()) return;
    canvas.style.display = "block";
    const w = window.innerWidth, h = window.innerHeight;
    const colors = COLORS.length;
    const shoot = (x, y, count, power, freq) => {
      burst(x, y, count, power);
      beep(freq + Math.floor(Math.random() * 220), 0.16);
    };
    if(kind === "grand"){
      let step = 0;
      const timer = setInterval(() => {
        shoot(w * (0.12 + Math.random() * 0.76), h * (0.14 + Math.random() * 0.42), 46, 6.2, 760);
        step++;
        if(step >= 16) clearInterval(timer);
      }, 260);
      shoot(w * 0.5, h * 0.32, 90, 8, 880);
    }else if(kind === "dual"){
      [0, 1, 2, 3, 4].forEach((i) => {
        setTimeout(() => {
          const side = i % 2 === 0 ? 0.3 : 0.7;
          shoot(w * (side + (Math.random() - 0.5) * 0.16), h * (0.22 + Math.random() * 0.28), 52, 6.6, 820);
        }, i * 230);
      });
    }else{
      [0, 1, 2].forEach((i) => {
        setTimeout(() => {
          shoot(w * (0.25 + Math.random() * 0.5), h * (0.2 + Math.random() * 0.3), 44, 5.8, 780);
        }, i * 260);
      });
    }
    void colors;
  }
  window.addEventListener("resize", () => { if(canvas) resize(); });
  return { launch, burst, resize };
})();

function launchFireworksCelebration(intensity){
  FX.launch(intensity === "grand" ? "grand" : intensity === "dual" ? "dual" : "standard");
}

  if(!soundOn) return;
  const notes = kind === "grand" ? [523, 659, 784, 1047, 1319] : kind === "big" ? [523, 659, 784, 1047] : [523, 784];

  box.innerHTML = `

      <button class="xbtn" type="button" data-close-stage>إغلاق</button>

      <button class="ghost" type="button" id="stgBoard">عرض السجل</button>

    </div>

    </div>`;
  openStageModal();
  const save = box.querySelector("#stgSave");
  if(save) save.addEventListener("click", async () => {
    save.disabled = true;
    save.textContent = "جارٍ الحفظ...";
    try{
      if(lastResult.timeSeconds == null) throw new Error("العب مرحلة كاملة أولاً");

    btn.addEventListener("click", () => { closeStageModal(); startStage(Number(btn.dataset.replay)); });
  });

// ===== شريط المراحل =====
function renderStepper(){
  const box = document.getElementById("stepper");
  if(!box) return;
  const data = readProgress();
  box.innerHTML = "";
  STAGE_IDS.forEach((key) => {
    const n = stageNum(key);
    const cfg = STAGE_CONFIG[n];
    const st = data.stages[key];
    const done = !!(st && st.completed);
    const unlocked = stageUnlocked(n, data);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "stepBtn" + (n === currentStage ? " active" : done ? " done" : unlocked ? "" : " locked");
    btn.dataset.stage = key;
    btn.disabled = !unlocked;
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-selected", n === currentStage ? "true" : "false");
    btn.title = cfg.label + " — " + cfg.cards + " بطاقة" + (done ? " · أفضل " + st.bestScore : "");
    btn.innerHTML = `<span class="dot">${done ? "✓" : n}</span><span class="lbl">${cfg.label}</span><b>${cfg.cards}</b>`;
    box.appendChild(btn);
  });
}

let manifestCache = null;
async function loadManifest(){
  if(manifestCache) return manifestCache;
  manifestCache = await (await fetch(MANIFEST_URL, { cache: "no-store" })).json();
  return manifestCache;
}

async function buildStage(stageNumValue = 1){
  currentStage = Math.min(3, Math.max(1, Number(stageNumValue) || 1));
  stageBonus = 0;
  const cfg = STAGE_CONFIG[currentStage];
  let pairsData = [];
  try{
    const data = await loadManifest();
    pairsData = Array.isArray(data && data.pairs) ? data.pairs : [];
  }catch(e){
    pairsData = [];
  }
  const chosen = pickK(pairsData, cfg.pairs);
  const cards = [];
  for(const p of chosen){
    cards.push({pair:p.id, img:IMG_BASE + p.img1});
    cards.push({pair:p.id, img:IMG_BASE + p.img2});
  }
  if(cfg.star) cards.push({pair:"__star__", special:"star", mystery:!!cfg.mystery});
  if(cfg.power){
    const kind = cfg.power === "random" ? pickPower() : cfg.power;
    cards.push({pair:"__power__", special:kind, mystery:!!cfg.mystery});
  }
  shuffle(cards);
  grid.innerHTML = "";
  for(const c of cards){
    const el = document.createElement("div");
    el.className = "card" + (c.special ? " special " + c.special : "") + (c.mystery ? " mystery" : "");
    el.dataset.pair = c.pair;
    if(c.special) el.dataset.special = c.special;
    const meta = c.special && c.special !== "star" ? POWER_META[c.special] : null;
    el.innerHTML = c.special === "star"
      ? `<div class="inner"><div class="face front"></div><div class="face back"><span class="starBig">⭐</span><span>بطاقة النجمة</span></div></div>`
      : meta
        ? `<div class="inner"><div class="face front"></div><div class="face back"><span class="starBig">${meta.icon}</span><span>${meta.title}</span></div></div>`
        : `<div class="inner">
      <div class="face front"></div>
      <div class="face back"><div class="imgBox"><img src="${c.img}" loading="lazy" alt=""></div></div>
    </div>`;
    if(!c.mystery) el.insertAdjacentHTML("beforeend", '<span class="glare"></span>');
    el.addEventListener("click", () => clickCard(el));
    grid.appendChild(el);
  }
  attachTilt();
  renderStepper();
  sizeGrid();
}

function setMoves(){
  movesBig.textContent=String(moves);
  if(mMoves)mMoves.textContent=String(moves);
}

function startStage(stageNumValue){
  stopTimer();
  clearAuto();
  clearFrenzy();
  clearFreeze();
  closeStageModal();
  currentStage = Math.min(3, Math.max(1, Number(stageNumValue) || 1));
  timeBig.textContent="00:00";
  if(mTime)mTime.textContent="00:00";
  startMs=0;running=false;elapsedSeconds=0;pausedTotal=0;
  moves=0;matchedPairs=0;setMoves();
  first=second=null;lock=false;
  stageBonus=0;pairPoints=0;
  comboStreak=0;comboMult=1;matchTimes=[];
  lastResult={timeSeconds:null,moves:null};
  for(const k of Object.keys(usedGradients))delete usedGradients[k];
  buildStage(currentStage);
  window.setCharacterState && window.setCharacterState('think');
}
function resetGame(){
  startStage(currentStage);
}

function clickSpecialCard(card){
  if(card.classList.contains("claimed") || lock) return;
  startTimerIfNeeded();
  const kind = card.dataset.special;
  lock = true;
  card.classList.add("claimed", "flipped");
  SoundFX.magic();
  navigator.vibrate?.([12, 40, 12]);
  const closeCard = (delay) => setTimeout(() => { card.classList.remove("flipped"); lock = false; }, delay || 600);

  if(kind === "star"){
    stageBonus += 25;
    pairPoints += 25;
    SoundFX.pop();
    stageToast("⭐ بطاقة النجمة: +25 نقطة");
    const c = cardCenter(card);
    floatText(c.x, c.y, "+25", "#ffd200");
    closeCard(700);
    return;
  }
  if(kind === "peek"){
    stageToast("🔍 كشف سريع: بطاقتان");
    const pool = [...grid.querySelectorAll(".card:not(.matched):not(.flipped):not(.special)")];
    const picks = [];
    while(picks.length < 2 && pool.length) picks.push(pool.splice(randInt(pool.length), 1)[0]);
    picks.forEach((c) => c.classList.add("peeked"));
    setTimeout(() => picks.forEach((c) => c.classList.remove("peeked")), 1300);
    closeCard(1350);
    return;
  }
  if(kind === "xray"){
    stageToast("👁️ رؤية الأشعة: كل البطاقات!");
    mascotSay("تركيز خارق! ⚡");
    const all = [...grid.querySelectorAll(".card:not(.matched):not(.flipped):not(.special)")];
    all.forEach((c) => c.classList.add("flipped", "xray-glow"));
    FX.burst(window.innerWidth / 2, window.innerHeight / 2, 40, 5.5);
    setTimeout(() => all.forEach((c) => c.classList.remove("flipped", "xray-glow")), 1250);
    closeCard(1300);
    return;
  }
  if(kind === "freeze"){
    stageToast("⌛ تجميد الزمن: 7 ثوانٍ");
    SoundFX.freeze();
    freezeClock(7);
    closeCard(700);
    return;
  }
  if(kind === "magnet"){
    stageToast("🪄 المغناطيس: مطابقة تلقائية");
    const pool = [...grid.querySelectorAll(".card:not(.matched):not(.flipped):not(.special)")];
    const groups = {};
    pool.forEach((c) => { (groups[c.dataset.pair] = groups[c.dataset.pair] || []).push(c); });
    const ready = Object.keys(groups).filter((k) => groups[k].length >= 2);
    closeCard(500);
    if(ready.length){
      const pairKey = ready[randInt(ready.length)];
      const [a, b] = groups[pairKey];
      setTimeout(() => {
        [a, b].forEach((c) => c.classList.add("flipped"));
        setTimeout(() => finishMatch(a, b), 260);
      }, 420);
    }
    return;
  }
  if(kind === "chest"){
    SoundFX.pop();
    openChest(card);
  }
}

// ===== صندوق الحظ (عجلة سريعة) =====
function openChest(card){
  const icons = ["250", "⭐", "🔥", "💎", "🎁"];
  let box = document.querySelector(".slotBox");
  if(!box){
    box = document.createElement("div");
    box.className = "slotBox";
    box.innerHTML = '<span class="slotIcon">🎁</span><div class="slotLbl">...</div>';
    document.body.appendChild(box);
  }
  box.classList.add("on");
  const iconEl = box.querySelector(".slotIcon"), lblEl = box.querySelector(".slotLbl");
  let ticks = 0;
  const spin = setInterval(() => {
    iconEl.textContent = icons[ticks % icons.length];
    lblEl.textContent = "جارٍ فتح الصندوق...";
    ticks++;
    SoundFX.flip();
    if(ticks >= 12){
      clearInterval(spin);
      const prize = ["bonus", "star", "frenzy"][randInt(3)];
      if(prize === "bonus"){
        iconEl.textContent = "💰";
        lblEl.textContent = "بونص +250 نقطة!";
        stageBonus += 250;
        pairPoints += 250;
      }else if(prize === "star"){
        iconEl.textContent = "⭐";
        lblEl.textContent = "نجمتان مضمونتان! +120";
        stageBonus += 120;
        pairPoints += 120;
      }else{
        iconEl.textContent = "🔥";
        lblEl.textContent = "وضع الاشتعال!";
        frenzyUntil = 0;
        triggerFrenzy();
      }
      SoundFX.pop();
      const c = cardCenter(card || document.body);
      floatText(c.x || window.innerWidth / 2, c.y || window.innerHeight / 2, "🎁!", "#ffd200");
      shakeScreen();
      setTimeout(() => { box.classList.remove("on"); if(card){ card.classList.remove("flipped"); lock = false; } }, 1200);
    }
  }, 90);
}

// ===== مطابقة (مع كومبو ونقاط) =====
function finishMatch(a, b){
  if(!a || !b) return;
  if(!usedGradients[a.dataset.pair]){
    usedGradients[a.dataset.pair]=pairGradients[Object.keys(usedGradients).length%pairGradients.length];
  }
  const g=usedGradients[a.dataset.pair];
  [a,b].forEach(c=>{
    c.classList.add("matched","match-anim");
    c.style.setProperty("--pair-gradient",g);
    setTimeout(()=>c.classList.remove("match-anim"),280);
  });
  matchedPairs++;
  registerMatch(a);
  const center=cardCenter(a);
  FX.burst(center.x,center.y,22,4.2);
  [a,b].forEach((c,i)=>setTimeout(()=>{const p=cardCenter(c);FX.burst(p.x,p.y,10,3)},i*70));
  window.setCharacterState && window.setCharacterState('win');
  const cfg=STAGE_CONFIG[currentStage];
  setTimeout(()=>{ if(matchedPairs !== cfg.pairs) window.setCharacterState && window.setCharacterState('think'); }, 1200);
  navigator.vibrate?.(18);
  if(matchedPairs >= cfg.pairs) completeStage();
}

// ===== إمالة ثلاثية الأبعاد ولمعان =====
function attachTilt(){
  if(!grid || grid.dataset.tilt) return;
  grid.dataset.tilt = "1";
  const reset = (card) => {
    card.style.setProperty("--rx", "0deg");
    card.style.setProperty("--ry", "0deg");
  };
  grid.addEventListener("pointermove", (e) => {
    if(e.pointerType === "touch") return;
    const card = e.target.closest(".card");
    if(!card) return;
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    card.style.setProperty("--ry", ((px - 0.5) * 14).toFixed(2) + "deg");
    card.style.setProperty("--rx", ((0.5 - py) * 14).toFixed(2) + "deg");
    card.style.setProperty("--gx", (px * 100).toFixed(0) + "%");
    card.style.setProperty("--gy", (py * 100).toFixed(0) + "%");
  }, { passive: true });
  grid.addEventListener("pointerout", (e) => {
    const card = e.target.closest(".card");
    if(card) reset(card);
  }, { passive: true });
}

function completeStage(){
  stopTimer();
  clearFrenzy();
  clearFreeze();
  const t = getTimeSeconds();
  const mv = moves;
  lastResult = { timeSeconds: t, moves: mv };
  const score = stageScore(currentStage, t, mv);
  const stars = stageStars(currentStage, t, mv);
  const saved = saveStageScore(currentStage, score, t, mv);
  renderStepper();
  mascotSay("يا بطل! 🔥");
  window.setCharacterState && window.setCharacterState('win');
  if(currentStage < 3){
    launchFireworksCelebration(currentStage === 2 ? "dual" : "standard");
    fanfare(currentStage === 2 ? "big" : "small");
    setTimeout(() => showStageClear(currentStage, { score, stars, time: t, moves: mv, saved, combo: pairPoints }), 720);
  }else{
    launchFireworksCelebration("grand");
    fanfare("grand");
    setTimeout(() => showGrandVictory(saved.data), 950);
  }
}

function clickCard(card){
  if(lock) return;
  if(card.dataset.special){ clickSpecialCard(card); return; }
  if(card===first||card.classList.contains("matched"))return;
  startTimerIfNeeded();
  SoundFX.flip();
  card.classList.add("flipped");
  if(!first){first=card;return}
  second=card;
  moves++;setMoves();

  if(first.dataset.pair===second.dataset.pair){
    const a=first,b=second;
    first=second=null;
    finishMatch(a,b);
  }else{
    lock=true;
    SoundFX.error();
    breakCombo();
    window.setCharacterState && window.setCharacterState('confused');
    setTimeout(()=>{
      first.classList.remove("flipped");
      second.classList.remove("flipped");
      first=second=null;lock=false;
      window.setCharacterState && window.setCharacterState('think');
    },380);
  }
}

function setupEventListeners(){
  gamesBtn.addEventListener("click",openGames);
  if(mGames)mGames.addEventListener("click",openGames);
  closeGames.addEventListener("click",closeGamesModal);
  gamesModal.addEventListener("click",e=>{if(e.target===gamesModal)closeGamesModal()});

  boardSide.addEventListener("click",openBoard);
  if(mBoard)mBoard.addEventListener("click",openBoard);
  closeBoard.addEventListener("click",closeBoardModal);
  boardModal.addEventListener("click",e=>{if(e.target===boardModal)closeBoardModal()});
  const stageModal=document.getElementById("stageModal");
  if(stageModal){
    stageModal.addEventListener("click",e=>{
      if(e.target===stageModal){closeStageModal();return}
      if(e.target.closest("[data-close-stage]")) closeStageModal();
    });
  }

  const stepper=document.getElementById("stepper");
  if(stepper){
    stepper.addEventListener("click",(e)=>{
      const btn=e.target.closest(".stepBtn");
      if(!btn||btn.disabled) return;
      const n=Number(btn.dataset.stage);
      if(!n||n===currentStage) return;
      startStage(n);
    });
  }
  
  saveBtn.addEventListener("click",async()=>{
    try{
      if(lastResult.timeSeconds==null){boardStatus.textContent="العب لعبة كاملة ثم احفظ";return}
      const name=(playerNameEl.value||"").trim().slice(0,20);
      await saveScore(name,lastResult.timeSeconds,lastResult.moves);
      boardStatus.textContent="تم الحفظ ✅";
      await loadBoard();
    }catch(e){boardStatus.textContent="فشل الحفظ: "+e.message}
  });

  restartSide.addEventListener("click",resetGame);
  if(mRestart){
    mRestart.addEventListener("click",resetGame);
    mRestart.addEventListener('touchstart',e=>{e.preventDefault();resetGame()},{passive:false});
  }
  
  soundSide.addEventListener("click",()=>{soundOn=!soundOn;syncSound()});
  if(mSound)mSound.addEventListener("click",()=>{soundOn=!soundOn;syncSound()});

  window.addEventListener("resize",sizeGrid);
  window.visualViewport?.addEventListener('resize',sizeGrid);
  window.visualViewport?.addEventListener('scroll',sizeGrid);
  window.addEventListener('orientationchange',()=>setTimeout(sizeGrid,200));
}

window.addEventListener('DOMContentLoaded',()=>{
  initElements();
  setupEventListeners();
  syncSound();
  try{ if(window.GameHub) GameHub.setActiveGame(STAGE_ID); }catch(e){}
  currentStage = initialStage();
  resetGame();
});





(function secretRevealOnSoundSide(){
  const soundBtn = document.getElementById("soundSide");
  if (!soundBtn) {
    console.warn("❌ لم يتم العثور على عنصر soundSide");
    return;
  }

  let taps = 0;
  let timer = null;

  function resetTaps(){
    taps = 0;
    if (timer) { clearTimeout(timer); timer = null; }
  }

  function revealExceptLastPairAndOpenBoard(){
    const allCards = Array.from(document.querySelectorAll(".card"));

    // ✅ إذا الكروت لم تُنشأ بعد
    if (allCards.length === 0) {
      console.warn("❌ لا توجد .card الآن (ربما لم تُنشأ بعد)");
      resetTaps();
      return;
    }

    // كل الكروت غير المكتملة (إن كانت matched مستخدمة)
    const unmatched = allCards.filter(c => !c.classList.contains("matched"));

    // ✅ إذا لم يكن لديك matched أو كلها غير matched، نعتبرها كلها unmatched
    const pool = (unmatched.length > 0) ? unmatched : allCards;

    // اترك آخر زوج فقط (آخر بطاقتين)
    const toReveal = (pool.length > 2) ? pool.slice(0, pool.length - 2) : [];

    toReveal.forEach(card => card.classList.add("flipped"));

    // افتح نافذة النتائج
    const modal = document.getElementById("boardModal");
    if (modal) modal.classList.add("show");

    const status = document.getElementById("boardStatus");
    if (status) status.textContent = "🧩 تم كشف الكروت ما عدا آخر زوج — اكتب اسمك واحفظ";

    resetTaps();
  }

  soundBtn.addEventListener("click", (e) => {
    // أحيانًا يكون الزر رابط <a> فيعمل تنقل/إعادة تحميل
    e.preventDefault?.();

    taps++;

    if (timer) clearTimeout(timer);
    timer = setTimeout(resetTaps, 2000);

    // Debug (احذفها لاحقًا إن أحببت)
    // console.log("taps:", taps);

    if (taps >= 5) {
      revealExceptLastPairAndOpenBoard();
    }
  });
})();







// ✅ Character Panel Random from manifest.json (Desktop)
// ✅ Character Panel States (think/confused/win/lose) from manifest.json (Desktop)
(async function characterPanelStates(){
  const imgEl = document.getElementById("charImg");
  if (!imgEl) return;

const CHAR_BASE = IMG_BASE;
const CHAR_MANIFEST_URL = CHAR_BASE + "manifest.json";


  // state buckets per character key
  const states = ["think","confused","win","lose"];

  // keyword matcher for state based on filename
  function inferStateFromFilename(src){
    const s = String(src).toLowerCase();
    if (/(win|winner|victory|happy|smile|rahb|rabah|rabeh)/.test(s)) return "win";
    if (/(lose|lost|defeat|sad|cry|khasir|khser|khasr|loser)/.test(s)) return "lose";
    if (/(confus|confused|hmm|oops|what|question|hesitate|7ayran|hayran|mohtaar|muhtar|mhtaar)/.test(s)) return "confused";
    if (/(think|thinking|idea|plan|brain|fكر|يفكر)/.test(s)) return "think";
    return "think"; // default fallback
  }

  function randInt(n){ return Math.floor(Math.random()*n); }
  function pick(arr){ return arr[randInt(arr.length)]; }

  let groups = {};      // groups[key] = {think:[],confused:[],win:[],lose:[],all:[]}
  let keys = [];
  let currentKey = "";
  let currentState = "think";
  let lastSrc = "";

  try{
    const res = await fetch(CHAR_MANIFEST_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("manifest fetch failed");
    const data = await res.json();

    const chars = data.characters || {};
    for (const key of Object.keys(chars)) {
      const rawArr = (chars[key] || []).map(fn => CHAR_BASE + fn);
      if (!rawArr.length) continue;

      const bucket = { think:[], confused:[], win:[], lose:[], all:[] };
      rawArr.forEach(src=>{
        bucket.all.push(src);
        const st = inferStateFromFilename(src);
        if (!bucket[st]) bucket[st]=[];
        bucket[st].push(src);
      });

      groups[key.toLowerCase()] = bucket;
    }

    keys = Object.keys(groups);
    if (!keys.length) return;

    currentKey = pick(keys);

    // pick a stable starter: prefer "think" images ending with 1.*
    const starterPool = (groups[currentKey].think.length ? groups[currentKey].think : groups[currentKey].all);
    let starter = starterPool.find(s => /1\.(png|jpg|jpeg|webp)$/i.test(s)) || pick(starterPool);
    lastSrc = starter;
    imgEl.src = starter;

  }catch(e){
    console.warn("⚠️ لم يتم تحميل الشخصيات من manifest.json", e);
    return;
  }

  // Smooth fade between states
  imgEl.style.transition = "opacity .18s ease";
  imgEl.style.opacity = "1";

  function applySrc(src){
    if (!src) return;
    if (src === lastSrc) return;
    lastSrc = src;

    imgEl.style.opacity = "0";
    setTimeout(()=>{
      imgEl.src = src;
      imgEl.style.opacity = "1";
    }, 120);
  }

  function pickFromState(key, state){
    const g = groups[key];
    if (!g) return "";
    const pool = (g[state] && g[state].length) ? g[state] : (g.think.length ? g.think : g.all);
    return pool.length ? pick(pool) : "";
  }

  function setCharacterKey(key){
    const k = String(key||"").toLowerCase();
    if (!groups[k]) return;
    currentKey = k;
    // when switching character, show think state
    const src = pickFromState(currentKey, "think");
    applySrc(src);
  }

  function setCharacterState(state){
    const st = states.includes(state) ? state : "think";
    currentState = st;
    const src = pickFromState(currentKey, st);
    applySrc(src);
  }

  // Expose controls for the game logic
  window.setCharacterState = setCharacterState;
  window.setCharacterKey = setCharacterKey;

  // Optional: random subtle variation while thinking (every 60s)
  let intervalMs = 60000;
  let timer = setInterval(()=>{
    if (currentState !== "think") return;
    const src = pickFromState(currentKey, "think");
    applySrc(src);
  }, intervalMs);

})();
