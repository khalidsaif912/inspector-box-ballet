name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir _site
          cp -R public/. _site/
          touch _site/.nojekyll
          V="${GITHUB_SHA::8}"
          for f in _site/game.html _site/index.html; do
            sed -i "s|game/game.css|game/game.css?v=$V|g; s|game/game.js|game/game.js?v=$V|g; s|game/ui.css|game/ui.css?v=$V|g; s|sw.js|sw.js?v=$V|g" "$f"
          done
          grep -o 'game/game\.\(css\|js\)?v=[a-f0-9]*' _site/game.html
          test -f _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
